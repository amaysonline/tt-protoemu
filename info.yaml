# Tiny Tapeout project information
project:
  title:        "Programmable protocol engine"
  author:       "Amay Sharma and Aarav Singh"
  discord:      "amaysonline"
  description:  "A tiny I/O processor that runs UART, SPI and I2C as programs"
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_amaysonline_protoemu"

  # Source files must be in ./src. Also update PROJECT_SOURCES in test/Makefile.
  source_files:
    - "project_phase0.v"
    - "uart_tx.v"
    - "baud_gen.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "TX_DATA0"
  ui[1]: "TX_DATA1"
  ui[2]: "TX_DATA2"
  ui[3]: "TX_DATA3"
  ui[4]: "TX_DATA4"
  ui[5]: "TX_DATA5"
  ui[6]: "TX_DATA6"
  ui[7]: "TX_DATA7"

  # Outputs
  uo[0]: "UART_TX"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
